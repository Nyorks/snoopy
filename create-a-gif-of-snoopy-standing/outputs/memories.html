<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>our little memories</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap');
      :root { --ink:#302d2a; --paper:#fffdf7; --cream:#fbf1df; --sky:#d9e9ed; --pink:#f1d0c8; --yellow:#f7e6b4; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); background:var(--cream); font-family:"DM Mono", ui-monospace, monospace; }
      .top { width:min(1100px, calc(100% - 38px)); margin:auto; padding:30px 0 12px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
      .back { border:2px solid var(--ink); color:var(--ink); text-decoration:none; background:var(--paper); padding:9px 12px; box-shadow:3px 3px 0 var(--ink); font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
      h1 { margin:0; text-align:center; font:700 clamp(44px,7vw,78px)/.8 Caveat, cursive; letter-spacing:-.04em; }
      .subtitle { text-align:center; margin:16px auto 34px; font-size:11px; letter-spacing:.09em; color:#766c61; text-transform:uppercase; }
      .wall { position:relative; width:min(1030px, calc(100% - 38px)); min-height:600px; margin:0 auto 45px; padding:54px 38px; border:2px solid var(--ink); background:#eedac4; box-shadow:10px 12px 0 rgba(48,45,42,.11); overflow:hidden; }
      .wall::before { content:""; position:absolute; inset:0; opacity:.35; background-image:radial-gradient(#b79980 .8px, transparent .8px); background-size:9px 9px; pointer-events:none; }
      .photo-grid { position:relative; z-index:1; display:grid; grid-template-columns:repeat(3,1fr); gap:45px 55px; align-items:start; }
      .polaroid { position:relative; padding:13px 13px 42px; background:var(--paper); border:1px solid #e5d9c8; box-shadow:5px 7px 10px rgba(66,48,32,.24); transition:transform .2s ease, box-shadow .2s ease; }
      .polaroid:hover { transform:translateY(-7px) rotate(0deg) !important; box-shadow:8px 13px 16px rgba(66,48,32,.26); }
      .polaroid::before { content:""; position:absolute; top:-16px; left:50%; width:90px; height:28px; transform:translateX(-50%) rotate(-3deg); background:rgba(217,233,237,.88); }
      .polaroid:nth-child(2n)::before { background:rgba(241,208,200,.86); transform:translateX(-50%) rotate(4deg); }
      .polaroid:nth-child(3n)::before { background:rgba(247,230,180,.86); }
      .polaroid:nth-child(1) { transform:rotate(-5deg); } .polaroid:nth-child(2) { transform:rotate(3deg); margin-top:25px; } .polaroid:nth-child(3) { transform:rotate(-2deg); }
      .polaroid:nth-child(4) { transform:rotate(4deg); margin-left:30px; } .polaroid:nth-child(5) { transform:rotate(-3deg); margin-top:8px; } .polaroid:nth-child(6) { transform:rotate(5deg); margin-right:28px; }
      .placeholder { aspect-ratio:1.15; display:flex; align-items:center; justify-content:center; overflow:hidden; color:#8d8174; background:linear-gradient(135deg, var(--sky) 0 50%, #f8ead3 50% 100%); border:1px dashed #a99b8c; }
      .placeholder svg { width:44%; height:44%; opacity:.65; }
      .caption { position:absolute; bottom:9px; left:14px; right:14px; font:600 24px/1 Caveat, cursive; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .hint { position:relative; z-index:1; margin:38px auto -20px; width:max-content; max-width:90%; padding:10px 16px; border:2px solid var(--ink); background:var(--pink); font:600 22px Caveat, cursive; transform:rotate(-1deg); }
      @media (max-width:720px) { .top { padding-top:21px; } .top span { display:none; } .wall { padding:42px 26px; } .photo-grid { grid-template-columns:repeat(2, 1fr); gap:38px 28px; } .polaroid:nth-child(4), .polaroid:nth-child(6) { margin-left:0; margin-right:0; } }
      @media (max-width:430px) { .photo-grid { grid-template-columns:1fr; max-width:260px; margin:auto; } .polaroid:nth-child(n) { margin:0; } }
    </style>
  </head>
  <body>
    <header class="top"><a class="back" href="index.html">← back to the note</a><h1>our little memories</h1><span></span></header>
    <p class="subtitle">photos saved in all the softest corners</p>

        <article class="polaroid"><div class="placeholder" aria-label="Photo placeholder"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"><rect x="12" y="18" width="76" height="64" rx="4"/><circle cx="37" cy="41" r="9"/><path d="M16 75 40 52l14 13 10-9 20 19"/></svg></div><div class="caption">sunny walks</div></article>
        <article class="polaroid"><div class="placeholder" aria-label="Photo placeholder"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"><rect x="12" y="18" width="76" height="64" rx="4"/><circle cx="37" cy="41" r="9"/><path d="M16 75 40 52l14 13 10-9 20 19"/></svg></div><div class="caption">you made me laugh</div></article>
        <article class="polaroid"><div class="placeholder" aria-label="Photo placeholder"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"><rect x="12" y="18" width="76" height="64" rx="4"/><circle cx="37" cy="41" r="9"/><path d="M16 75 40 52l14 13 10-9 20 19"/></svg></div><div class="caption">the sweetest quiet</div></article>
        <article class="polaroid"><div class="placeholder" aria-label="Photo placeholder"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"><rect x="12" y="18" width="76" height="64" rx="4"/><circle cx="37" cy="41" r="9"/><path d="M16 75 40 52l14 13 10-9 20 19"/></svg></div><div class="caption">always us</div></article>
        <article class="polaroid"><div class="placeholder" aria-label="Photo placeholder"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"><rect x="12" y="18" width="76" height="64" rx="4"/><circle cx="37" cy="41" r="9"/><path d="M16 75 40 52l14 13 10-9 20 19"/></svg></div><div class="caption">one more for later</div></article>
      </section>

    </main>
  </body>
</html>
